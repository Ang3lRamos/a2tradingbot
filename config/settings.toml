[bot]
# Una instancia = una combinación de exchange y mercado. En la fase 5 se puede correr una segunda.
instance = "binance-perp"
exchange = "binance"      # "binance" (Demo Trading) o "bybit" (testnet; bloqueado en algunas regiones)
market_type = "swap"      # "spot" (solo long) o "swap" (perpetuos, long y short)
quote = "USDT"
bases = ["BTC", "ETH", "SOL"]
timeframe = "1h"

[ai]
# "cli" usa tu suscripción vía claude -p. Más adelante "api" usará la API de Anthropic.
provider = "cli"
filter_model = "haiku"
decision_model = "sonnet"
# Por debajo del límite de tu plan, para dejar margen a tu uso normal de Claude.
daily_call_limit = 40
# Tope aparte para las tandas de `python -m tradebot.ai_eval`; no le quita cupo al bot en vivo.
eval_daily_call_limit = 300
timeout_seconds = 180
# Si la IA falla o se agota la cuota: "veto" (no operar la señal) o "base" (operarla sin revisión).
fallback = "veto"

[risk]
risk_per_trade = 0.003   # 0,3%: con 0,5% el drawdown in-sample (11,8%) activaba el kill switch del 10%
stop_atr_multiple = 1.5
take_profit_r = 2.0
max_open_positions = 3
max_daily_loss = 0.02
max_drawdown = 0.10

[strategy]
# Variante activa (ver src/tradebot/backtest/variants.py). Elegida con python -m tradebot.backtest.compare:
# ruptura de canal de 20 velas de 4h, positiva en los 4 sub-periodos in-sample y estable entre 10 y 40 velas.
variant = "donchian-4h-20"
# Parámetros de indicadores. Los de RSI y EMAs solo los usan las variantes "pullback":
# tendencia por EMAs y entrada cuando el RSI cruza rsi_long_trigger (long) o rsi_short_trigger (short).
ema_fast = 50
ema_slow = 200
rsi_period = 14
rsi_long_trigger = 40
rsi_short_trigger = 60
atr_period = 14

[backtest]
initial_capital = 10000
fee_rate = 0.0005      # comisión taker de futuros en Binance (0,05%) por lado
slippage = 0.0002      # 0,02% en contra en cada entrada y salida a mercado
# Desde esta fecha los datos son out-of-sample: no se miran hasta la evaluación final.
oos_start = "2025-11-09"
# Inicio del in-sample con el que se eligió la estrategia (primera vela de entonces + 60 días de calentamiento).
is_start = "2024-01-09T06:00:00+00:00"
